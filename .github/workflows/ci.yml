name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# These jobs run on a self-hosted runner — a Mac on a desk, not a disposable
# VM. On a public repository a pull request from a fork would therefore be
# arbitrary code execution on that machine, so the jobs run only for pull
# requests raised from a branch in this repository. A fork PR reports no CI
# rather than running untrusted code; a reviewer can re-run it from a local
# branch.
jobs:
  package:
    name: Build and test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      # The source tests read this machine, so they need a real Mac — which is
      # what the self-hosted runner is. They assert plausible ranges rather
      # than values, so they pass whatever the runner happens to be doing.
      - name: Test
        run: swift test

      - name: Build release
        run: swift build -c release

      # Exercises the sampling path end to end without a window.
      - name: Smoke test CLI
        run: |
          swift run -c release monitorctl list
          swift run -c release monitorctl read

      # The front doors, against the real binaries. CommandLineTests covers the
      # parsing, but the bug in #48 was that `--help` reached the start path —
      # a daemon booting instead of printing is only visible from outside the
      # process. Every invocation here must return promptly and write nothing.
      - name: Smoke test CLI help and version
        run: |
          set -euo pipefail
          for binary in monitorctl monitord monitor-exporter; do
            swift run -c release "$binary" --help
            swift run -c release "$binary" --version
          done
          # An unrecognised flag must be refused, not ignored. `!` because a
          # non-zero exit is the pass condition.
          ! swift run -c release monitord --nonsense
          ! swift run -c release monitorctl list --nonsense
          ! swift run -c release monitor-exporter --nonsense

      # monitord --help must not leave a CSV behind: writing one is exactly the
      # symptom #48 reported.
      - name: monitord --help writes nothing
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          swift run -c release monitord --dir "$dir" --help
          if [ -n "$(ls -A "$dir")" ]; then
            echo "monitord --help wrote to $dir:"
            ls -la "$dir"
            exit 1
          fi

      # Boot the exporter and scrape it once, the front-door check the argument
      # tests cannot make: a served /metrics with the right shape. The runner is
      # an M-series Mac with fans and a real GPU, so the full set is present —
      # unlike a fanless machine, where the fan series is correctly absent.
      - name: Smoke test the exporter endpoint
        run: |
          set -euo pipefail
          swift build -c release --product monitor-exporter
          bin="$(swift build -c release --product monitor-exporter --show-bin-path)/monitor-exporter"
          "$bin" --bind-port 9650 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          # --retry-connrefused rather than a fixed sleep: connect as soon as the
          # listener is up, and fail only if it never comes up.
          body="$(curl --retry 20 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:9650/metrics)"
          echo "$body"
          echo "$body" | grep -q monitor_exporter_build_info
          echo "$body" | grep -q 'macos_smc_temperature_celsius{sensor="cpu"}'

  lint:
    name: Format check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Ensure swiftformat
        run: |
          if ! command -v swiftformat >/dev/null 2>&1; then
            brew install swiftformat
          fi
          # Printed so a lint failure caused by a tool upgrade introducing new
          # rules is obvious from the log rather than looking like a code
          # regression.
          echo "swiftformat $(swiftformat --version)"

      - name: Lint
        run: swiftformat Sources Tests Plugins --lint --cache ignore

      # release.yml runs this script unattended on every merge to main, where a
      # wrong answer ships the wrong version. Tested here, on every pull
      # request, so a broken refusal is caught before it matters (#53).
      - name: Test release scripts
        run: Scripts/test-release-pr-number.sh

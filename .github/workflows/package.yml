name: Package

# Builds monitor.app and the headless tools, packages them as a disk image and
# a zip, and — when it is given a release tag — attaches both to that release.
#
# It is a reusable workflow rather than a step in the release workflow because
# a release can begin two ways: a merge to main that bumps the version, or a
# release published by hand from the GitHub UI. Both end here, so the artifact
# is built exactly one way.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to attach the files to. Omit to only build them.
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build and package monitor.app
    # A self-hosted runner — a Mac on a desk. Only a merge to main, a published
    # release or a manual run reaches this workflow, and all three need write
    # access to the repository, so there is no fork path to guard against.
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          # A release built from a tag must be built from that tag's code. The
          # default checkout of a `release` event is the tag already, but being
          # explicit means a hand-made release on an old commit still ships
          # that commit rather than the tip of main.
          ref: ${{ inputs.tag || github.ref }}

      - name: Swift version
        run: swift --version

      # A published build must not contain code that fails its own gates, and a
      # tag can point anywhere — including at a commit that never ran CI.
      - name: Test
        run: swift test

      # Signing and notarizing are opt-in through repository variables, and both
      # are all-or-nothing once set. The credentials live in the runner's own
      # keychain — this is a Mac on a desk, not a disposable VM — so nothing
      # secret passes through GitHub and these two variables are only names.
      #
      #   SIGN_IDENTITY    e.g. "Developer ID Application: NAME (TEAMID)"
      #   NOTARY_PROFILE   a notarytool credential profile on that Mac
      #
      # Unset, a release is ad-hoc signed and unnotarized, exactly as before.
      # Set, a failure to sign or notarize fails the release rather than
      # quietly publishing files nobody can open. See docs/signing.md.
      - name: Build monitor.app
        env:
          MONITOR_SIGN_IDENTITY: ${{ vars.SIGN_IDENTITY }}
        run: Scripts/make-app.sh

      # Before packaging, because the app has to be stapled before it goes into
      # the disk image: stapler writes into the bundle, so an image made first
      # would hold an unstapled app. The tools go in the same submission.
      - name: Notarize
        if: vars.NOTARY_PROFILE != ''
        env:
          MONITOR_NOTARY_PROFILE: ${{ vars.NOTARY_PROFILE }}
        run: Scripts/notarize.sh .build/package

      # Two files, not one. The app goes in a disk image beside a link to
      # /Applications, so installing it is one drag. The headless tools go in a
      # zip of their own: binaries in the drag window would make it unclear what
      # to drag.
      - name: Package
        id: package
        env:
          MONITOR_SIGN_IDENTITY: ${{ vars.SIGN_IDENTITY }}
          MONITOR_NOTARY_PROFILE: ${{ vars.NOTARY_PROFILE }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*static let string = "\(.*\)".*/\1/p' \
              Sources/MonitorCore/Version.swift)"
          dmg="monitor-${version}.dmg"
          zip="monitor-tools-${version}.zip"

          Scripts/make-dmg.sh .build/package/monitor.app "$dmg"

          # Everything make-app.sh staged except the app. ditto, not zip, and
          # without --keepParent so the tools sit at the top level of the zip,
          # where install-exporter.sh expects to find the binary beside it.
          rm -rf .build/tools
          mkdir .build/tools
          rsync -a --exclude monitor.app .build/package/ .build/tools/
          ditto -c -k .build/tools "$zip"

          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          ls -lh "$dmg" "$zip"

      # After every step that writes the files, so each checksum describes
      # what is uploaded. The checksums ride along as files rather than lines
      # in the notes: re-running a failed publish then replaces them instead of
      # appending a second copy.
      - name: Checksum
        env:
          DMG: ${{ steps.package.outputs.dmg }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          shasum -a 256 "$DMG" > "$DMG.sha256"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          cat "$DMG.sha256" "$ZIP.sha256"

      # Uploaded on every run, released or not, so a manual run is a way to get
      # a build without publishing anything.
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-app
          path: |
            ${{ steps.package.outputs.dmg }}
            ${{ steps.package.outputs.dmg }}.sha256
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          if-no-files-found: error

      - name: Attach to release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          DMG: ${{ steps.package.outputs.dmg }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          if ! command -v gh >/dev/null 2>&1; then brew install gh; fi
          # --clobber so a re-run replaces the assets rather than failing on a
          # name that already exists.
          gh release upload "$TAG" "$DMG" "$DMG.sha256" "$ZIP" "$ZIP.sha256" --clobber
